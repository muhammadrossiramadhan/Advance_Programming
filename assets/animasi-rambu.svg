<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260">
  <defs>
    <style>
      .title { font: bold 18px system-ui, sans-serif; fill: #f8fafc; }
      .sub { font: 13px system-ui, sans-serif; fill: #94a3b8; }
      .lbl { font: bold 13px monospace; fill: #e2e8f0; }
      .car-fast { animation: moveFast 3.5s linear infinite; }
      .car-alt { animation: moveAlt 4.5s linear infinite; }
      .pulse-red { animation: pulse 1.2s ease-in-out infinite; }
      @keyframes moveFast {
        0% { transform: translateX(0px); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateX(250px); opacity: 0; }
      }
      @keyframes moveAlt {
        0% { transform: translate(0px, 0px); opacity: 0; }
        15% { transform: translate(55px, 0px); opacity: 1; }
        45% { transform: translate(115px, 42px); opacity: 1; }
        80% { transform: translate(200px, 42px); opacity: 1; }
        100% { transform: translate(250px, 0px); opacity: 0; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="800" height="260" rx="14" fill="#0f172a"/>
  <text x="24" y="34" class="title">Sistem Rambu Informasi Dinamis - Kota Malang</text>
  <text x="24" y="54" class="sub">Simulasi Live: Kondisi Lancar (Rute Utama) vs Kondisi Macet (Pengalihan Rute Dijkstra)</text>

  <rect x="24" y="74" width="365" height="164" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="40" y="98" class="lbl" fill="#4ade80">1. LANCAR (A -&gt; B -&gt; C -&gt; D | Bobot: 9)</text>
  <rect x="44" y="138" width="320" height="22" rx="4" fill="#334155"/>
  <line x1="50" y1="149" x2="358" y2="149" stroke="#facc15" stroke-width="2" stroke-dasharray="10 8"/>
  <rect x="135" y="110" width="140" height="22" rx="4" fill="#166534" stroke="#4ade80"/>
  <text x="150" y="125" class="lbl">RAMBU: LANCAR</text>
  <g class="car-fast">
    <rect x="52" y="141" width="28" height="16" rx="4" fill="#38bdf8"/>
    <rect x="70" y="143" width="6" height="12" rx="1" fill="#e0f2fe"/>
  </g>
  <circle cx="56" cy="149" r="10" fill="#1e3a8a" stroke="#fff" stroke-width="1.5"/>
  <text x="52" y="153" class="lbl">A</text>
  <circle cx="150" cy="149" r="10" fill="#1e3a8a" stroke="#fff" stroke-width="1.5"/>
  <text x="146" y="153" class="lbl">B</text>
  <circle cx="250" cy="149" r="10" fill="#1e3a8a" stroke="#fff" stroke-width="1.5"/>
  <text x="246" y="153" class="lbl">C</text>
  <circle cx="344" cy="149" r="10" fill="#dc2626" stroke="#fff" stroke-width="1.5"/>
  <text x="340" y="153" class="lbl">D</text>

  <rect x="411" y="74" width="365" height="164" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="427" y="98" class="lbl" fill="#f87171">2. B-C MACET (Alihkan A -&gt; B -&gt; E -&gt; D | 12)</text>
  <rect x="431" y="138" width="320" height="20" rx="4" fill="#334155"/>
  <rect x="545" y="140" width="84" height="16" rx="3" fill="#dc2626" class="pulse-red"/>
  <path d="M 537 148 L 537 190 L 731 190 L 731 148" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linejoin="round" opacity="0.45"/>
  <rect x="522" y="110" width="150" height="22" rx="4" fill="#991b1b" stroke="#f87171"/>
  <text x="532" y="125" class="lbl">RAMBU: ALIHKAN</text>
  <g class="car-alt">
    <rect x="438" y="140" width="26" height="15" rx="4" fill="#fbbf24"/>
  </g>
  <circle cx="443" cy="148" r="10" fill="#1e3a8a" stroke="#fff" stroke-width="1.5"/>
  <text x="439" y="152" class="lbl">A</text>
  <circle cx="537" cy="148" r="10" fill="#1e3a8a" stroke="#fff" stroke-width="1.5"/>
  <text x="533" y="152" class="lbl">B</text>
  <circle cx="637" cy="190" r="10" fill="#1e3a8a" stroke="#fff" stroke-width="1.5"/>
  <text x="633" y="194" class="lbl">E</text>
  <circle cx="731" cy="148" r="10" fill="#dc2626" stroke="#fff" stroke-width="1.5"/>
  <text x="727" y="152" class="lbl">D</text>
</svg>
